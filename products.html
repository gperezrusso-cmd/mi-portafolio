<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        
        .product-info {
            padding: 15px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .product-price {
            font-size: 16px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .product-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nuestros Productos</h1>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">Producto 1</div>
                <div class="product-info">
                    <div class="product-name">Producto 1</div>
                    <div class="product-price">$29.99</div>
                    <div class="product-description">Descripción del producto 1</div>
                    <button class="btn">Comprar</button>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image">Producto 2</div>
                <div class="product-info">
                    <div class="product-name">Producto 2</div>
                    <div class="product-price">$39.99</div>
                    <div class="product-description">Descripción del producto 2</div>
                    <button class="btn">Comprar</button>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image">Producto 3</div>
                <div class="product-info">
                    <div class="product-name">Producto 3</div>
                    <div class="product-price">$49.99</div>
                    <div class="product-description">Descripción del producto 3</div>
                    <button class="btn">Comprar</button>
                </div>
            </div>
            
            <div class="product-card">
                <div class="product-image">Producto 4</div>
                <div class="product-info">
                    <div class="product-name">Producto 4</div>
                    <div class="product-price">$34.99</div>
                    <div class="product-description">Descripción del producto 4</div>
                    <button class="btn">Comprar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
